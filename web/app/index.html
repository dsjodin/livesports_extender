<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070A10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SHL Arena</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand">SHL Arena</div>
    <div class="conn" id="conn">Ansluter…</div>
  </header>
  <main>
    <section class="view" id="view-matcher" hidden></section>
    <section class="view" id="view-live"></section>
    <section class="view" id="view-installningar" hidden></section>
  </main>
  <nav class="tabs">
    <button data-view="matcher">Matcher</button>
    <button data-view="live" class="on">Live</button>
    <button data-view="installningar">Inställningar</button>
  </nav>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
